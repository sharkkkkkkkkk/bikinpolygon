<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background dark rounded square -->
  <rect width="200" height="200" rx="36" fill="#0A0F1E"/>

  <!-- Polygon outline (pentagon-like shape) -->
  <polygon
    points="100,30 158,70 158,130 100,170 42,130 42,70"
    stroke="#39FF14"
    stroke-width="5"
    fill="none"
    stroke-linejoin="round"
  />

  <!-- Inner accent lines (diagonal cross inside polygon) -->
  <line x1="100" y1="30" x2="100" y2="170" stroke="#39FF14" stroke-width="2" stroke-opacity="0.35"/>
  <line x1="42" y1="70" x2="158" y2="130" stroke="#39FF14" stroke-width="2" stroke-opacity="0.35"/>
  <line x1="158" y1="70" x2="42" y2="130" stroke="#39FF14" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Vertex nodes (glowing dots at corners) -->
  <circle cx="100" cy="30"  r="6" fill="#39FF14"/>
  <circle cx="158" cy="70"  r="6" fill="#39FF14"/>
  <circle cx="158" cy="130" r="6" fill="#39FF14"/>
  <circle cx="100" cy="170" r="6" fill="#39FF14"/>
  <circle cx="42"  cy="130" r="6" fill="#39FF14"/>
  <circle cx="42"  cy="70"  r="6" fill="#39FF14"/>

  <!-- Center dot -->
  <circle cx="100" cy="100" r="5" fill="white" fill-opacity="0.8"/>

  <!-- Glow filter -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
